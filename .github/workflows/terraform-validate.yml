name: terraform-validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tf-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: BRBuffington/terraform-pipelines-github/.github/workflows/terraform-validate.yml@main
    with:
      working_dir: "."
      run_tflint: true
      run_checkov: true
      runs_on: '["ubuntu-latest"]'
    permissions:
      contents: read
      pull-requests: write

  workflow-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pytest pyyaml
      - run: python -m pytest tests/test_workflow_alignment.py -q
